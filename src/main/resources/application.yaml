server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-evento
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/eventos/**
            - id: ms-inscricao
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/incricoes/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-produto
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/produtos/**
            - id: ms-pedido
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/pedidos/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
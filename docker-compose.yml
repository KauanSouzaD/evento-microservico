services:
  db:
    image: postgres:18-alpine
    container_name: db_inscricao
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: setme198
      POSTGRES_DB: inscricaodb
    ports:
      - 5433:5432
    shm_size: 128mb
    restart: always
    volumes:
      - pgdata:/var/lib/postgres/data

volumes:
  pgdata:
services:
  db:
    image: postgres:17-alpine
    container_name: db_evento
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: produtos
    ports:
      - 5434:5432
    shm_size: 128mb
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: